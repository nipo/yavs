# Conformance report (#780): regenerates the parts of docs/conformance.md that need only yavs and the
# fetched corpora, uploads the report as an artifact and checks the committed copy. Nothing is published
# outside the repository. On main a stale committed report is a warning; on a release tag it fails the run.
# It also runs cocotb's own regression over VHPI (tools/cocotb, a pinned cocotb from PyPI and its tests
# from GitHub); a failing job there fails the run.
# Nightly on main, by hand (`gh workflow run conformance.yml --ref main`, which RELEASING.md uses) and on a
# release tag; not on a push to main (maintainer, 2026-11-01, #1033). A red nightly opens an issue.
name: conformance

on:
  schedule:
    - cron: "41 4 * * *"
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# On main and on tags every run has a group of its own and finishes (as in ci.yml), so a newer push
# does not cancel a report being made.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  YAVS_CORPUS: ${{ github.workspace }}/.corpus-cache

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .corpus-cache
          key: corpus-${{ hashFiles('tools/fetch-corpus.sh') }}
      - run: tools/fetch-corpus.sh "$YAVS_CORPUS"
      - run: cargo build --release --locked -p yavs
      - name: Regenerate the report and compare it with the committed one
        id: report
        # A stale committed report fails only on release tags; the steps that cannot run here
        # (reference simulators, vendor libraries) keep the records of docs/conformance-local.json.
        continue-on-error: ${{ github.ref_type != 'tag' }}
        run: |
          tools/conformance/run.py --check --no-sandbox --core 1 \
            --yavs target/release/yavs --out "$RUNNER_TEMP/conformance"
      - uses: astral-sh/setup-uv@v6
      - name: cocotb's own regression over VHPI (tools/cocotb)
        run: |
          mkdir -p "$RUNNER_TEMP/conformance"
          python3 -I tools/cocotb/run.py --no-sandbox --jobs 4 --yavs target/release/yavs \
            --dir "$RUNNER_TEMP/cocotb" --json "$RUNNER_TEMP/conformance/cocotb-ci.json"
      - name: Stale report warning
        if: steps.report.outcome == 'failure'
        run: echo "::warning::docs/conformance.md differs from the regenerated report; run tools/conformance/run.py and commit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            ${{ runner.temp }}/conformance/conformance.md
            ${{ runner.temp }}/conformance/*.json

  report:
    needs: conformance
    if: ${{ always() && github.event_name == 'schedule' && needs.conformance.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the conformance nightly issue
        run: |
          body="Nightly conformance run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID on \`$GITHUB_SHA\`: result \`${{ needs.conformance.result }}\`."
          gh label create conformance-nightly --color B60205 --description "Red nightly conformance run on main" 2>/dev/null || true
          n=$(gh issue list --label conformance-nightly --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --label conformance-nightly --title "Nightly conformance is red on main" \
              --body "$body

          Kept up to date by .github/workflows/conformance.yml: later red nightly runs comment here. Close it when the run is green again."
          fi
