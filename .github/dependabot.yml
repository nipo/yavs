# Dependabot for the Rust dependencies. The root workspace covers crates/*; fuzz/ is a separate
# Cargo workspace with its own lockfile, so it gets its own entry.
# CI (ci.yml) runs on every pull_request, Dependabot PRs included.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Cranelift (yavs-clift, `clift` feature, #481) is pinned with "=": 0.x minor releases are
      # breaking, so major and minor bumps are made by hand after the clift benchmarks
      # (docs/STATUS.md, "clift"); patch releases come with the group above.
      - dependency-name: "cranelift*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
