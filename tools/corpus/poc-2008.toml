# Extra analyze flags per tool (UVVM has non-protected shared variables).
[flags]
sim1 = []
yavs = []

[[source]]
id = "poc"
url = "https://github.com/VHDL/PoC"
commit = "b90402732980e3fdbc4d2339c0b7d16dbc0b3d79"
license = "Apache-2.0"
# release v3.0.0 (tag, also the head of main), with its submodules (OSVVM, OSVVM-Common, OSVVM-UART, OSVVM-AXI4, OSVVM-Scripts); Open Source VHDL Group, successor of the archived VLSI-EDA/PoC (Chair of VLSI-Design, TU Dresden)

# Test benches in the compile list above: how they are run, what passing means, and their top units.
[testbenches]
runner = "regression.tcl (OSVVM scripts: build.pro / RunAllTests.pro, `RunTest` per test case) on sim2, sim1 or other OSVVM-supported tools; equivalently sim1 -e <test case configuration> -r"
passes = "OSVVM: the test controller's alert and log checks report no failure (AlertLogPkg EndOfTestReports PASSED)"

[[testbenches.bench]]
lib = "tb_arith_PRNG"
source = "poc"
path = "tb/arith/PRNG/arith_PRNG_TestHarness.vhdl"
top = "arith_PRNG_TestHarness"
